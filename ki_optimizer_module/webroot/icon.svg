<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182017"/>
      <stop offset="50%" stop-color="#232d21"/>
      <stop offset="100%" stop-color="#131912"/>
    </linearGradient>

    <!-- Emerald / Sage Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58d68d"/>
      <stop offset="50%" stop-color="#38b000"/>
      <stop offset="100%" stop-color="#208b3a"/>
    </linearGradient>

    <!-- Accent Green Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70e000"/>
      <stop offset="100%" stop-color="#134611"/>
    </linearGradient>

    <!-- Subtle Circuit Trace Pattern -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38b000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#70e000" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base for Android Launcher Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Border / Ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Subtle Micro Circuit Lines -->
  <g stroke="url(#traceGrad)" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Top & Bottom nodes -->
    <path d="M120 70 L120 120 L160 140"/>
    <circle cx="120" cy="70" r="5" fill="#38b000" fill-opacity="0.4"/>
    <path d="M392 70 L392 120 L352 140"/>
    <circle cx="392" cy="70" r="5" fill="#38b000" fill-opacity="0.4"/>
    <path d="M120 442 L120 392 L160 372"/>
    <circle cx="120" cy="442" r="5" fill="#38b000" fill-opacity="0.4"/>
    <path d="M392 442 L392 392 L352 372"/>
    <circle cx="392" cy="442" r="5" fill="#38b000" fill-opacity="0.4"/>
    
    <!-- Left & Right cross tabs -->
    <path d="M70 256 L130 256"/>
    <circle cx="70" cy="256" r="5" fill="#38b000" fill-opacity="0.4"/>
    <path d="M442 256 L382 256"/>
    <circle cx="442" cy="256" r="5" fill="#38b000" fill-opacity="0.4"/>
  </g>

  <!-- Central Chip Octagon Base -->
  <polygon points="190,140 322,140 372,190 372,322 322,372 190,372 140,322 140,190"
           fill="#10150f" stroke="#38b000" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Stylized "Ki" Emblem -->
  <!-- Letter K: Left Pillar + Upper & Lower Arms -->
  <g filter="url(#coreGlow)">
    <!-- K - Left Vertical Pillar -->
    <path d="M190 196 L216 196 L216 316 L190 316 Z" fill="url(#emeraldGrad)"/>

    <!-- K - Top Slanted Arm -->
    <path d="M216 258 L272 196 L298 196 L238 260 Z" fill="url(#emeraldGrad)"/>

    <!-- K - Bottom Slanted Arm -->
    <path d="M228 248 L298 316 L268 316 L216 264 Z" fill="url(#emeraldGrad)"/>

    <!-- Letter i: Lower Stem -->
    <path d="M312 232 L334 232 L334 316 L312 316 Z" fill="url(#emeraldGrad)"/>

    <!-- Letter i: Power Pulse Dot (Glow Core) -->
    <circle cx="323" cy="204" r="11" fill="#70e000"/>
    <circle cx="323" cy="204" r="6" fill="#ffffff"/>
  </g>

  <!-- Small Subtitle: KERNEL -->
  <text x="256" y="420" font-family="-apple-system, Roboto, sans-serif" font-size="28" font-weight="800" fill="#70e000" letter-spacing="8" text-anchor="middle" fill-opacity="0.85">OPTIMIZER</text>
</svg>
